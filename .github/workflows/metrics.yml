name: Metrics

on:
  schedule: [{ cron: "0 18 * * *" }]   # 18:00 UTC == 23:30 IST daily
  workflow_dispatch:
  push: { branches: ["main"] }

permissions:
  contents: read

env:
  # Metrics SVGs have a transparent background by default, but their text is
  # tuned for light mode. This lifts the palette when the viewer's OS is dark.
  DARK_MODE_CSS: |
    @media (prefers-color-scheme: dark) {
      svg { color: #adbac7; }
      h1, h2, h3 { color: #539bf5; }
      .field, .value, li, p, span, td, th { color: #adbac7; }
      footer, .meta, .nowrap.small { color: #768390; }
    }

jobs:

  # ── Panel 1 (top-left) ── base statistics ────────────────────────────────
  general:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: general.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          extras_css: ${{ env.DARK_MODE_CSS }}

  # ── Panel 2 (top-right) ── most used languages ───────────────────────────
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: languages.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, makefile
          extras_css: ${{ env.DARK_MODE_CSS }}

  # ── Panel 3 (bottom-left) ── isometric contribution calendar ─────────────
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: isocalendar.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: ${{ env.DARK_MODE_CSS }}

  # ── Panel 4 (bottom-right) ── GitHub achievements ────────────────────────
  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: achievements.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          extras_css: ${{ env.DARK_MODE_CSS }}

