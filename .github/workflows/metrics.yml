name: Metrics

on:
  schedule: [{ cron: "0 18 * * *" }]   # 18:00 UTC == 23:30 IST daily
  workflow_dispatch:
  push: { branches: ["main"] }

permissions:
  contents: read

env:
  # Tokyo Night. Metrics has no built-in theme input, so the palette is applied as
  # extra CSS on every panel. A fixed dark ground means every visitor sees the same
  # design, regardless of their OS or GitHub theme.
  THEME_CSS: |
    svg {
      background-color: #1a1b26;
      color: #a9b1d6;
    }
    h1 { color: #c0caf5; }
    h2, h3 { color: #7aa2f7; }
    h1 svg, h2 svg, h3 svg { fill: #7aa2f7; }
    .field { color: #a9b1d6; }
    .field svg { fill: #565f89; }
    footer { color: #565f89; }
    .calendar .day { outline-color: rgba(255, 255, 255, 0.05); }
    :root {
      --color-calendar-graph-day-bg: #24283b;
      --color-calendar-graph-day-border: rgba(255, 255, 255, 0.04);
      --color-calendar-graph-day-L1-bg: #2d4f67;
      --color-calendar-graph-day-L2-bg: #3d6a8a;
      --color-calendar-graph-day-L3-bg: #5d9fd6;
      --color-calendar-graph-day-L4-bg: #7aa2f7;
      --color-calendar-graph-day-L1-border: rgba(255, 255, 255, 0.04);
      --color-calendar-graph-day-L2-border: rgba(255, 255, 255, 0.04);
      --color-calendar-graph-day-L3-border: rgba(255, 255, 255, 0.04);
      --color-calendar-graph-day-L4-border: rgba(255, 255, 255, 0.04);
    }

jobs:

  # ── Base statistics ───────────────────────────────────────────────────────
  general:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: general.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          extras_css: ${{ env.THEME_CSS }}

  # ── Most used languages ───────────────────────────────────────────────────
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: languages.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, makefile
          extras_css: ${{ env.THEME_CSS }}

  # ── Isometric contribution calendar ───────────────────────────────────────
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: isocalendar.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: ${{ env.THEME_CSS }}

  # ── Coding habits: when and how you work ──────────────────────────────────
  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: habits.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          extras_css: ${{ env.THEME_CSS }}

  # ── Lines of code written ─────────────────────────────────────────────────
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: lines.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4
          extras_css: ${{ env.THEME_CSS }}

  # ── GitHub achievements ───────────────────────────────────────────────────
  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nishanthsr7-eng
          filename: achievements.svg
          output_action: gist
          committer_gist: ${{ secrets.METRICS_GIST }}
          config_timezone: Asia/Kolkata
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          extras_css: ${{ env.THEME_CSS }}

  # ── Animated contribution snake ───────────────────────────────────────────
  # Generated here, then uploaded straight into the same gist as the panels,
  # so there is no output branch and no bot commits anywhere in the repo.
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: nishanthsr7-eng
          # Tokyo Night ramp, matching THEME_CSS above.
          # Quoted because '#' would otherwise start a YAML comment.
          outputs: "dist/snake.svg?color_snake=#bb9af7&color_dots=#24283b,#2d4f67,#3d6a8a,#5d9fd6,#7aa2f7"

      - name: Upload snake.svg to gist
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GIST_ID: ${{ secrets.METRICS_GIST }}
        run: |
          set -euo pipefail
          test -s dist/snake.svg || { echo "::error::snake.svg missing or empty"; exit 1; }
          echo "generated $(wc -c < dist/snake.svg) bytes"
          jq -n --rawfile content dist/snake.svg \
            '{files: {"snake.svg": {content: $content}}}' > payload.json
          code=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @payload.json \
            "https://api.github.com/gists/$GIST_ID")
          if [ "$code" != "200" ]; then
            echo "::error::gist update failed with HTTP $code"
            cat response.json
            exit 1
          fi
          echo "snake.svg uploaded to gist"
